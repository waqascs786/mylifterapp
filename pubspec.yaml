name: my_lifter_app
description: A mobile app generated by LifterMobileApp from WordPress LMS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.0
  cached_network_image: ^3.3.0
  flutter_html: ^3.0.0-beta.2
  provider: ^6.1.0
  shimmer: ^3.0.0
  video_player: ^2.8.0
  permission_handler: ^11.0.0
  path_provider: ^2.1.0
  url_launcher: ^6.2.0
  webview_flutter: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/